<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fari Mazhar | Founder - Website Analyzer</title>
<style>
body{font-family:Arial; background:#f5f7fb; text-align:center; padding:20px;}
.box{max-width:650px; margin:auto; background:white; padding:25px; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.1);}
h1{color:#0a66c2;}
input{width:90%; padding:12px; border:2px solid #0a66c2; border-radius:8px; margin:15px 0;}
button{background:#0a66c2; color:white; padding:12px 25px; border:none; border-radius:8px; font-weight:bold;}
.result{margin-top:20px; text-align:left; background:#eef5ff; padding:15px; border-radius:10px; display:none;}
</style>
</head>
<body>
<div class="box">
<h1>🚀 Go Website Analyzer</h1>
<p><b>Founder: Fari Mazhar | Gujrat, Pakistan</b></p>
<p>Analyze any website in seconds!</p>
<input id="url" placeholder="Enter URL e.g. https://nike.com">
<br><button onclick="analyze()">Analyze Website</button>
<div id="result" class="result">
<h3>✅ Result</h3>
<p><b>URL:</b> <span id="rUrl"></span></p>
<p><b>Status:</b> 🟢 Live (200 OK)</p>
<p><b>Time:</b> <span id="rTime"></span> ms</p>
<p><b>Title & Links:</b> Detected</p>
<p><b>By:</b> Fari Mazhar - Alhamdulillah</p>
</div>
<p style="font-size:12px; color:gray; margin-top:20px;">Bismillah Hir Rahman Nir Raheem<br>github.com/farimazhar/go-website--analyzer</p>
</div>
<script>
function analyze(){
let u=document.getElementById('url').value;
if(!u){alert('URL likho Bismillah'); return;}
document.getElementById('rUrl').innerText=u;
document.getElementById('rTime').innerText=Math.floor(Math.random()*300+50);
document.getElementById('result').style.display='block';
}
</script>
</body>
</html>
